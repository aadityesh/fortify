<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" viewBox="0 0 1080 320" role="img" aria-labelledby="title desc">
  <title id="title">Fortify: App Lock</title>
  <desc id="desc">A lime fortress shield and keyhole beside the Fortify wordmark on a charcoal tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182019"/>
      <stop offset="1" stop-color="#090C0A"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E2FF9B"/>
      <stop offset="1" stop-color="#C8EB68"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="28" y="28" width="264" height="264" rx="64" fill="url(#tile)"/>
  <rect x="29" y="29" width="262" height="262" rx="63" fill="none" stroke="#D4F57A" stroke-opacity=".22" stroke-width="2"/>

  <!-- A fortified shield outline keeps the icon lighter and clearer at small sizes. -->
  <path d="M91 82h33v23h24V82h33v23h24V82h33v90c0 42-31 68-86 89-55-21-86-47-86-89z"
        fill="#101610" stroke="url(#lime)" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="176" cy="151" r="20" fill="url(#lime)"/>
  <path d="M166 168h20l10 38h-40z" fill="url(#lime)"/>

  <!-- Wordmark -->
  <text x="352" y="168" fill="#F2F4EF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="92" font-weight="650" letter-spacing="2">FORTIFY</text>
  <path d="M357 202h78" stroke="#D4F57A" stroke-width="5" stroke-linecap="round"/>
  <text x="456" y="214" fill="#D4F57A" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="24" font-weight="600" letter-spacing="8">MY MAC</text>
</svg>
